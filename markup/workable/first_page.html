ng hands-on experience with *React.js*.</p><p>* Strong understanding of:</p><p> * Functional Components</p><p> * React Hooks</p><p> * Component lifecycle</p><p> * Props and state</p><p> * Context API</p><p> * Custom Hooks</p><p> * Reusable component design</p><p>* Experience building large-scale React applications.</p><p><strong>State Management</strong></p><p>* Strong experience with *Redux / Redux Toolkit*.</p><p>* Understanding of global vs local state management.</p><p>* Experience handling asynchronous state and API data.</p><p>* Familiarity with alternatives such as *React Query / TanStack Query* is a plus.</p><p><strong>Modern Frontend Development</strong></p><p>* Strong knowledge of *JavaScript (ES6+)*.</p><p>* Good understanding of *TypeScript*.</p><p>* Experience with modern CSS and responsive design.</p><p>* Experience with component-based UI development.</p><p>* Understanding of frontend architecture and design patterns.</p><p>* Experience with modern build tools such as *Vite, Webpack, or similar*.</p><p>* Understanding of code splitting, lazy loading, caching, and frontend performance optimization.</p><p><strong>Microservices &amp; API Integration</strong></p><p>* Experience integrating React applications with *microservices-based backend systems*.</p><p>* Strong understanding of *REST APIs* and JSON.</p><p>* Understanding of:</p><p> * API authentication</p><p> * Authorization</p><p> * HTTP methods and status codes</p><p> * API error handling</p><p> * Pagination</p><p> * Filtering and sorting</p><p> * File uploads</p><p> * Webhooks/events from a frontend perspective</p><p>* Ability to work with multiple backend services/APIs within a single frontend application.</p><p>* Understanding of service boundaries and how frontend applications interact with distributed backend systems.</p><p><strong>HTML / CSS</strong></p><p>* Strong knowledge of *HTML5, CSS3, and responsive design*.</p><p>* Experience with modern CSS frameworks such as *Tailwind CSS, Bootstrap, or Material UI*.</p><p>* Ability to convert UI/UX designs into clean and responsive frontend implementations.</p><p>* Good understanding of accessibility and cross-browser compatibility.</p><p><strong>Git &amp; Development Practices</strong></p><p>* Strong experience with *Git and GitHub/GitLab/Bitbucket*.</p><p>* Experience with:</p><p> * Feature branches</p><p> * Pull requests</p><p> * Code reviews</p><p> * Merge conflicts</p><p> * Release workflows</p><p>* Understanding of CI/CD workflows is a plus.</p><p><strong>Nice-to-Have Skills</strong></p><p>* Experience with *Next.js*.</p><p>* Experience with *TypeScript* in production applications.</p><p>* Experience with *React Query / TanStack Query*.</p><p>* Experience with *WebSockets or real-time applications*.</p><p>* Experience with *Micro Frontends* is a strong plus.</p><p>* Experience with *Storybook*.</p><p>* Experience writing frontend unit/integration tests using *Jest, Vitest, React Testing Library, or Cypress/Playwright*.</p><p>* Understanding of Docker and containerized applications.</p><p>* Experience working with cloud environments such as AWS.</p><p>* Understanding of application observability and frontend monitoring.</p><p>* Experience working in Agile/Scrum teams.</p><p><strong>Frontend Architecture Expectations</strong></p><p>The candidate should have an understanding of how to build frontend applications that can scale as the product grows.</p><p>They should be comfortable with concepts such as:</p><p>* Component-driven architecture</p><p>* Feature-based folder structure</p><p>* Reusable UI components</p><p>* Separation of concerns</p><p>* State management</p><p>* API/service abstraction layers</p><p>* Error and loading-state management</p><p>* Authentication/authorization</p><p>* Performance optimization</p><p>* Lazy loading and code splitting</p><p>* Environment-based configuration</p><p>* Scalable frontend project structure</p><p><strong>Example Technology Stack</strong></p><p>*Frontend*</p><p>* React.js</p><p>* TypeScript</p><p>* Redux Toolkit</p><p>* React Query / TanStack Query</p><p>* HTML5</p><p>* CSS3</p><p>* Tailwind CSS / Material UI</p><p><strong>Backend Integration</strong></p><p>* REST APIs</p><p>* Microservices</p><p>* JSON</p><p>* OAuth/JWT-based authentication</p><p>Development</p><p>* Git</p><p>* GitHub/GitLab</p><p>* Vite / Webpack</p><p>* Docker</p><p>* CI/CD</p><p><strong>Testing</strong></p><p>* Jest / Vitest</p><p>* React Testing Library</p><p>* Cypress / Playwright</p><p><strong>Soft Skills</strong></p><p>* Strong problem-solving and debugging skills.</p><p>* Good communication and collaboration skills.</p><p>* Ability to work independently and as part of a team.</p><p>* Strong attention to detail.</p><p>* Ability to understand business requirements and translate them into technical solutions.</p><p>* Willingness to learn new technologies and modern development practices.</p><p>* Comfortable working in a fast-paced product development environment.</p><p><strong>What We Are Looking For</strong></p><p>We are looking for someone who is not only capable of writing React components but can *think beyond individual screens and build scalable frontend systems*.</p><p>The ideal candidate should understand *how a modern frontend communicates with distributed backend services, manages application state, handles failures, performs efficiently, and remains maintainable as the application grows.*</p>","url":"https://jobs.workable.com/view/6mw9kuL6CFZPcmTdZQk7CK/remote-frontend-developer-(react.js)---egypt-in-egypt-at-flatgigs","language":"en","locations":["TELECOMMUTE","Egypt"],"location":{"city":"","subregion":null,"countryName":"Egypt"},"created":"2026-08-11T06:47:17.456Z","updated":"2026-08-11T06:47:17.456Z","company":{"id":"533b83d2-079b-4b89-89fa-069a189e0a6d","title":"Flatgigs","website":"https://www.flatgigs.com","image":"https://workablehr.s3.amazonaws.com/uploads/account/logo/542477/logo","description":"<p><strong>Flatgigs, Your Strategic es work reliably from end to end.</p><p></p><h3><strong>Responsibilities</strong></h3><ul><li>Take full technical ownership of the existing application and assess what needs to be fixed, improved, optimized, or rebuilt.</li><li>Troubleshoot and improve backend functionality, with a strong focus on authentication, user profiles, databases, order flows, and real-time syncing.</li><li>Work across the product’s main interfaces, including the customer app, driver app, retailer dashboard, and admin dashboard.</li><li>Review the existing Lovable-built application and make improvements while identifying areas that may require rebuilding or restructuring.</li><li>Build, maintain, and optimize backend functionality using Supabase and related technologies.</li><li>Manage and work with code hosted on GitHub, ensuring a clean and maintainable development setup.</li><li>Ensure customer, driver, retailer, and admin data flows correctly across the platform.</li><li>Troubleshoot authentication, sign-in, profiles, dashboards, order management, and real-time updates.</li><li>Ensure end-to-end order and operational flows function correctly across different user types.</li><li>Work with booking, calendar-based, and other workflow-driven functionality where required.</li><li>Identify technical issues proactively and recommend practical solutions based on scalability, reliability, and maintainability.</li><li>Test functionality thoroughly and resolve bugs or issues before launch.</li><li>Maintain clear documentation of the product setup, technical decisions, and key workflows.</li><li>Explain technical decisions, challenges, and recommendations clearly to a non-technical founder.</li><li>Work independently and manage technical priorities with minimal supervision.</li><li>Ensure a smooth technical handover and knowledge transfer if additional developers are brought into the team in the future.</li></ul>","socialSharingDescription":"We are looking for a skilled and adaptable Full-Stack Developer to join the technology team of a fast-growing, early-stage company building a multi-sided digital platform. You will take technical ownership of an existing application and play a hands-on...","employmentType":"Full-time","benefitsSection":"","requirementsSection":"<ul><li>3+ years of experience in full-stack development, with strong backend development experience.</li></ul><ul><li>Hands-on experience working with Lovable or strong familiarity with AI-assisted application development platforms.</li><li>Strong experience with Supabase or similar backend, database, and authentication platforms.</li><li>Comfortable working with GitHub and existing codebases.</li><li>Proven experience troubleshooting, improving, and completing existing applications rather than only building new products from scratch.</li><li>Strong understanding of authentication, user profiles, databases, APIs, dashboards, and application workflows.</li><li>Experience working with real-time data, syncing, notifications, or similar live application functionality.</li><li>Experience working across multiple user interfaces or role-based platforms.</li><li>Strong problem-solving skills and the ability to quickly understand an existing technical setup.</li><li>Ability to determine when existing functionality should be fixed or optimized versus rebuilt.</li><li>Comfortable working independently and taking full technical ownership of a product.</li><li>Strong communication skills and the ability to explain technical concepts clearly to non-technical stakeholders.</li><li>Comfortable working in an early-stage, founder-led environment with a high level of ambiguity and ownership.</li><li>Strong attention to detail, reliability, and a practical approach to solving technical problems.</li></ul><p></p><h3><strong>Nice to Have</strong></h3><ul><li>Experience building multi-sided products involving customers, drivers, retailers/vendors, and administrators.</li><li>Experience with real-time order tracking or operational workflows.</li><li>Experience quickly rebuilding or restructuring parts of an application when the existing architecture is difficult to maintain.</li><li>Experience working in early-stage startups or founder-led environments.</li><li>Ability and willingness to collaborate on-site in the future if required.</li></ul>","url":"https://jobs.workable.com/view/uBWVwmoJ1PFh9d2hMf9SAq/remote-full-stack-developer---lovable-%26-supabase-in-egypt-at-hire-fellows","language":"en","locations":["TELECOMMUTE","Egypt"],"location":{"city":"","subregion":null,"countryName":"Egypt"},"created":"2026-09-03T14:43:35.358Z","updated":"2026-09-03T14:43:35.358Z","company":{"id":"00cebbd8-e8d6-42b6-86c0-b9e1f3436637","title":"Hire Fellows","website":"https://hirefellows.notion.site/about-hire-fellows","image":"","description":"","url":"https://jobs.workable.com/company/16MsB7NPWNXksSf2u175iv/jobs-at-hire-fellows","socialSharingDescription":""},"isFeatured":false,"workplace":"remote"},{"department":"Engineering","id":"5eaf8f82-3e5f-4ad9-a78b-8389cb06e90e","title":"Front-End Software Engineer (Remote)","state":"published","description":"<p>As an engineer at Bask you will work directly with the CEO and CTO to build and design the software infrastructure that will serve as the backbone of telehealth.</p><p>We are looking to expand our software engineers, seeking those with deep rooted entrepreneurial spirit.</p><p>Our serverless platform is a multi-tenant monorepo — Next.js and React on the front, tRPC and Prisma behind it, deployed on SST, TypeScript throughout. One engineer can follow a change from a form field to the database without crossing a team boundary. That's the point.</p><p>Engineering at Bask Health is AI-first and builder-led. Work starts with general understanding of problem, moves to tools like Claude and Cursor for further investigation, making a plan and building, tested on staging with realistic data, released to production, tested with real patient and care teams, and then back for systems and polish. AI is a default part of how we work, not a side experiment — because moving fast in healthcare requires every advantage.</p><p>We are looking for engineers who take end-to-end ownership, treat AI as a real collaborator, and care deeply about building software that meaningfully improves how healthcare is delivered.</p><p><br /><strong>What You'll Do</strong><br /></p><ul><li><strong>Design, build, and ship high-quality product experiences.</strong> Own key surfaces end to end, from concept through production. Write elegant, well-tested code — we have a real test suite and we intend to keep it that way.</li><li><strong>Work across the stack. </strong>Follow a feature from the interface through the API to the database. No handoffs, no waiting on another team.</li><li><strong>Work AI-first with Cursor and Claude Code.</strong> Use LLMs as your starting point. Draft intent, explore implementations, scaffold components, and refactor with AI in the loop. Apply your own judgment to meet the quality bar healthcare demands.</li><li><strong>Prototype fast and validate with real users.</strong> Build and test quickly with real patients and care teams. Use what you learn to refine before fully committing — especially in sensitive clinical contexts where getting it right matters.</li><li><strong>Build for scale and own the codebase.</strong> Translate product needs into reusable, well-architected patterns that make the next feature faster to ship.</li><li><strong>Make automation legible and trustworthy. </strong>Build systems that clearly communicate what AI and automation are doing on behalf of patients and providers. Earn trust through transparency, reliability, and thoughtful defaults.</li><li><strong>Champion performance, accessibility, and reliability. </strong>Ship work that is fast, robust, and accessible. Partner across the team to debug, optimize, and raise the bar over time.</li><li><strong>Share AI-native workflows. </strong>Document prompts, patterns, and workflows that work, so we move faster together without cutting corners that matter to patient outcomes.</li></ul><p>We are a highly collaborative team.</p>","socialSharingDescription":"As an engineer at Bask you will work directly with the CEO and CTO to build and design the software infrastructure that will serve as the backbone of telehealth.We are looking to expand our software engineers, seeking those with deep rooted entrepreneu...","employmentType":"Full-time","benefitsSection":"","requirementsSection":"<p>A full-stack generalist who has taken a product from 0 to 1 and can apply that instinct inside a system that already has real patients on it. Entrepreneurial, willing to roll up their sleeves, and drawn to a mission that disrupts how healthcare gets delivered.</p><ul><li>5+ Years of experience</li><li>You are dangerous on the frontend of the stack.</li></ul><ul><li>You are a highly skilled dev (React, TypeScript, Next.js, Tailwind and JavaScript).</li></ul><ul><li>You also have backend skills (tRPC, Drizzle ORM, SQL, Node, SST).</li></ul><ul><li>You can work independently and are comfortable owning entire projects or large areas of the codebase.</li></ul><ul><li>Strong experience building paid products and services is preferred.</li></ul><ul><li>React Native or Expo experience is a plus.</li></ul><ul><li>You are a strong communicator, able to clearly articulate technical problems, constraints, and timelines.</li></ul><ul><li>You are comfortable working in a fast-paced, unstructured, startup environment.</li></ul>","url":"https://jobs.workable.com/view/cG9zmf9uz9jEoE5Eq5SrBd/front-end-software-engineer-(remote)-in-cario-at-bask-health","language":"en","locations":["TELECOMMUTE","cario, Egypt"],"location":{"city":"cario","subregion":null,"countryName":"Egypt"},"created":"2026-08-20T11:43:18.479Z","updated":"2026-08-20T11:43:18.479Z","company":{"id":"df5c3135-78e5-4729-bd5e-1f6cd71efe99","title":"Bask Health","website":"http://bask.health","image":"https://workablehr.s3.amazonaws.com/uploads/account/logo/671909/logo","description":"<p>Bask provides a full service software that allows you to build any digital health experience. Built for doctors, physicians, entrepreneurs, and developers, the Bask system was built at enterprise scale for the everyday user.</p>","url":"https://jobs.workable.com/company/tzJ2Win5SoWhhZerQWrMjH/jobs-at-bask-health","socialSharingDescription":"​Bask provides a full service software that allows you to build any digital health experience. Built for doctors, physicians, entrepreneurs, and developers, the Bask system was built at enterprise scale for the everyday user.​"},"isFeatured":false,"workplace":"remote"},{"department":"Engineering","id":"16b09e54-f3fb-40d5-8e25-43e513cdaf8d","title":"Junior Full Stack Engineer","state":"published","description":"<p>We are looking for a <strong>Junior Full Stack Engineer</strong> to join our team and contribute to building, maintaining, and improving web applications</p><h3>Responsibilities</h3><ul><li>Develop and maintain web applications using <strong>Angular</strong>.</li><li>Build responsive and reusable UI components.</li><li>Integrate frontend applications with <strong>RESTful APIs</strong>.</li><li>Contribute to backend development and database-related tasks.</li><li>Debug, troubleshoot, and improve application performance.</li><li>Collaborate with developers and product teams to deliver high-quality features</li></ul>","socialSharingDescription":"We are looking for a Junior Full Stack Engineer to join our team and contribute to building, maintaining, and improving web applicationsResponsibilitiesDevelop and maintain web applications using Angular.Build responsive and reusable UI components.Inte...","employmentType":"Full-time","benefitsSection":"<ul><li><strong>Medical Insurance</strong></li><li><strong>Fast-Paced &amp; Dynamic Work Environment</strong></li><li><strong>Learning &amp; Career Growth Opportunities</strong></li><li><strong>Collaborative &amp; Supportive Team</strong></li></ul><p></p>","requirementsSection":"<ul><li><strong>2 years of experience</strong> in Full Stack or Web Development.</li><li>Good hands-on experience with <strong>Angular</strong>.</li><li>Strong knowledge of <strong>TypeScript, HTML, and CSS</strong>.</li><li>Understanding of <strong>REST APIs and API integration</strong>.</li><li>Basic knowledge of backend development, preferably <strong>Node.js</strong> or <strong>.NET</strong>.</li><li>Basic understanding of <strong>SQL/NoSQL databases</strong>.</li><li>Familiarity with <strong>Git</strong> and version control.</li><li>Good problem-solving and communication skills.</li></ul>","url":"https://jobs.workable.com/view/3Nvq5D2PxYJ5rnERV5zTgT/junior-full-stack-engineer-in-maadi-at-the-hr-game","language":"en","locations":["maadi, Al Qāhirah, Egypt"],"location":{"city":"maadi","subregion":"Al Qāhirah","countryName":"Egypt"},"created":"2026-08-19T11:23:10.625Z","updated":"2026-08-19T11:23:10.625Z","company":{"id":"1ab94b70-be5b-461e-969d-bc5c0438a14b","title":"The HR Game","website":"http://www.linkedin.com/company/the-hr-game","image":"https://workablehr.s3.amazonaws.com/uploads/account/logo/693425/logo","description":"","url":"https://jobs.workable.com/company/4ip6FvKjJUwybEPsrTnCar/jobs-at-the-hr-game","socialSharingImage":"https://workablehr.s3.amazonaws.com/uploads/account/open_graph_logo/693425/social","socialSharingDescription":""},"isFeatured":false,"workplace":"on_site"},{"id":"e4ec8c8d-119e-4843-8af6-5386fe12be2d","title":"UI/UX Designer","state":"published","description":"<h3><strong>The Role</strong></h3><p>We're hiring a talented, hands-on <strong>UI/UX Designer</strong> to create intuitive, polished, and engaging digital experiences across AllCare's products, websites, and digital platforms.</p><p>This is a highly creative, execution-focused role. You'll take product requirements, user needs, business objectives, and early concepts and turn them into thoughtful user flows, wireframes, prototypes, and polished interfaces that are both visually strong and easy to use.</p><p>We're looking for someone with a strong visual eye and deep understanding of user experience who can take ownership of the design process from initial concept through developer handoff and final implementation — not simply create individual screens.</p><h3>What You'll Own</h3><ul><li><strong>UI/UX Design:</strong> Design intuitive, modern, and polished interfaces for AllCare's digital products, websites, landing pages, and other digital experiences.</li><li><strong>User Flows &amp; Wireframes:</strong> Translate product requirements and user needs into clear user journeys, information architecture, wireframes, and interaction flows.</li><li><strong>High-Fidelity Design &amp; Prototyping:</strong> Create detailed responsive designs and interactive prototypes in Figma that clearly communicate functionality and intended user experience.</li><li><strong>Design Systems:</strong> Build and maintain scalable design systems, reusable components, typography, icons, spacing standards, and UI patterns to ensure consistency across products.</li><li><strong>Responsive Design:</strong> Design experiences that work seamlessly across desktop, tablet, and mobile, with a strong understanding of responsive and mobile-first design principles.</li><li><strong>Developer Collaboration:</strong> Work closely with front-end developers to ensure designs are technically feasible, clearly documented, and accurately implemented.</li><li><strong>Design QA:</strong> Review implemented interfaces, identify inconsistencies or usability issues, and collaborate with developers through final production.</li><li><strong>UX Optimization:</strong> Use user feedback, analytics, and behavioral insights to identify friction points and continuously improve usability and conversion.</li><li><strong>Web &amp; Digital Design:</strong> Support the ongoing design and improvement of websites, landing pages, and other digital experiences while maintaining a consistent brand identity.</li><li><strong>Cross-Functional Collaboration:</strong> Work closely with product, engineering, marketing, creative, and leadership to understand objectives and translate them into thoughtful digital experiences.</li></ul>","socialSharingDescription":"The RoleWe&#39;re hiring a talented, hands-on UI/UX Designer to create intuitive, polished, and engaging digital experiences across AllCare&#39;s products, websites, and digital platforms.This is a highly creative, execution-focused role. You&#39;ll ta...","employmentType":"","benefitsSection":"<h3><strong>Compensation &amp; Benefits:</strong></h3><ul><li>Competitive package of <strong>USD $1,200–$1,400 per month (including performance bonus)</strong>, commensurate with experience, portfolio, and technical skill.</li><li><strong>Schedule:</strong> Monday–Friday, 9:00 AM – 5:00 PM PST</li><li><strong>Location:</strong> Remote (Egypt-based candidates only)</li><li>US holiday calendar — you're off when your US-based team is off (Thanksgiving, Christmas, Memorial Day, Labor Day, and more).</li><li>Health benefits and paid time off.</li></ul>","requirementsSection":"<h3><strong>What We're Looking For</strong></h3><p>Above all: someone with an exceptional portfolio who can demonstrate both strong visual design instincts and a thoughtful approach to user experience. We're looking for a designer who can take ownership of a product or experience from initial problem through final implementation rather than simply execute individual screens.</p><p></p><ul><li><strong>Proven Experience:</strong> 4–5+ years of professional experience in UI/UX design, product design, web design, or a closely related role.</li><li><strong>Strong Portfolio:</strong> A portfolio demonstrating polished web, SaaS, product, or application design with clear examples of both UI and UX thinking.</li><li><strong>Figma Expertise:</strong> Advanced proficiency in Figma, including components, auto layout, design systems, prototyping, and developer handoff.</li><li><strong>UX Fundamentals:</strong> Strong understanding of user flows, information architecture, interaction design, usability, and user-centered design principles.</li><li><strong>Visual Fundamentals:</strong> Excellent understanding of typography, hierarchy, spacing, composition, color, and visual consistency.</li><li><strong>Responsive Design:</strong> Strong understanding of responsive and mobile-first design across desktop, tablet, and mobile experiences.</li><li><strong>Design Systems:</strong> Experience creating, maintaining, and working within scalable component libraries and design systems.</li><li><strong>Developer Collaboration:</strong> Experience working directly with front-end developers and understanding how designs translate into production.</li><li><strong>Front-End Understanding:</strong> Familiarity with modern front-end technologies and workflows, including HTML/CSS, JavaScript, React, and Next.js.</li><li><strong>Concept-to-Execution:</strong> Ability to take a product requirement, user problem, or rough concept and independently develop it into a polished, production-ready experience.</li><li><strong>Speed &amp; Ownership:</strong> Comfortable working in a fast-moving environment, managing multiple projects, incorporating feedback quickly, and taking ownership from concept through implementation.</li><li><strong>Communication:</strong> Excellent written and verbal English.</li></ul><h3>Nice to Have</h3><ul><li>Experience designing products for technology, healthcare, SaaS, or AI companies.</li><li>Experience designing complex platforms, dashboards, workflows, or data-heavy applications.</li><li>Experience using analytics or behavioral tools such as Google Analytics, Hotjar, or similar platforms to inform design decisions.</li><li>Experience with Webflow or WordPress.</li><li>Experience working with React/Next.js development teams.</li><li>Familiarity with Adobe Creative Suite, including Photoshop and Illustrator.</li><li>Experience working with US-based product, engineering, or marketing teams.</li><li>Experience in a startup or high-growth environment where designers are expected to move quickly and work independently</li></ul>","url":"https://jobs.workable.com/view/ugzhhtTnYDT8kzuTF9Mxax/hybrid-ui%2Fux-designer-in-cairo-at-yalent","language":"en","locations":["Cairo, Cairo Governorate, Egypt"],"location":{"city":"Cairo","subregion":"Cairo Governorate","countryName":"Egypt"},"created":"2026-09-01T18:59:52.788Z","updated":"2026-09-01T18:59:52.788Z","company":{"id":"6d7a339a-9cab-4aff-8d76-e04f13e4a7d8","title":"Yalent","website":"http://jesica.ai","image":"","description":"","url":"https://jobs.workable.com/company/ew61qLVCmwC8sAwjrCAtS9/jobs-at-yalent","socialSharingImage":"https://workablehr.s3.amazonaws.com/uploads/account/open_graph_logo/671222/social","socialSharingDescription":""},"isFeatured":false,"workplace":"hybrid"}],"autoAppliedFilters":{}}}}, featureFlags: {"candidateProfileEnabled":true,"featured-postings":true,"admin-company-tab-featured-jobs":true,"wjb_personalization_enabled":true,"wjb_weekly_job_digest_enabled":true,"disallow_rejected_job_for_publish":false,"wjb_acp_turnstile_captcha_enabled":true,"wjb_allow_daily_job_suggestions_enabled":true,"wjb_complete_profile_prompt_enabled":true,"wjb_google_drive_upload_enabled":true,"wjb_atlas_enabled":true}, config: Object.assign({"swDisabled":false,"turnstileWidgetSiteKey":"0x4AAAAAAAVY8hH3nz6RxaK0","heroTemplate":"horizontal","organization":"workable","shieldClientFlavor":"job_board_client"}, { googleAnalyticsKey: undefined, bubblesEnabled: undefined }), assets: {"logo":"https://dcvxs6ggqztsa.cloudfront.net/job-board/assets/jobs-by-workable-logo-2026.png","favicon":{"original":{"url":"https://workablehr-ui.s3.amazonaws.com/job-board/assets/favicon.ico","type":"image/x-icon"},"small":{"url":"https://workablehr-ui.s3.amazonaws.com/job-board/ass
